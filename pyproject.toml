[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "busybar-msteams"
version = "0.1.0"
description = "Show the next Teams meeting and live call state on a BUSY Bar"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "busylib>=1.3.0",
  "httpx>=0.28.1",
  "msal>=1.37.0",
]

[project.scripts]
busybar-msteams = "busybar_msteams.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.4.1",
  "ruff>=0.15.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/busybar_msteams"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
